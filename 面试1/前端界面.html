<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 / 注册</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <div class="card">
      <!-- 顶部切换按钮 -->
      <div class="tabs">
        <button id="loginTab" class="tab active">登录</button>
        <button id="registerTab" class="tab">注册</button>
      </div>

      <!-- 登录表单 -->
      <form id="loginForm" class="form active">
        <h2>欢迎回来</h2>

        <div class="input-group">
          <label for="loginAccount">账号</label>
          <input type="text" id="loginAccount" placeholder="请输入账号" />
          <p class="error" id="loginAccountError"></p >
        </div>

        <div class="input-group">
          <label for="loginPassword">密码</label>
          <input type="password" id="loginPassword" placeholder="请输入密码" />
          <p class="error" id="loginPasswordError"></p >
        </div>

        <button type="submit" class="submit-btn">登录</button>
      </form>

      <!-- 注册表单 -->
      <form id="registerForm" class="form">
        <h2>创建账号</h2>

        <div class="input-group">
          <label for="registerAccount">账号</label>
          <input type="text" id="registerAccount" placeholder="请输入账号" />
          <p class="error" id="registerAccountError"></p >
        </div>

        <div class="input-group">
          <label for="registerPassword">密码</label>
          <input type="password" id="registerPassword" placeholder="请输入密码" />
          <p class="error" id="registerPasswordError"></p >
        </div>

        <div class="input-group">
          <label for="confirmPassword">确认密码</label>
          <input type="password" id="confirmPassword" placeholder="请再次输入密码" />
          <p class="error" id="confirmPasswordError"></p >
        </div>

        <button type="submit" class="submit-btn">注册</button>
      </form>
    </div>
  </div>

  <!-- Toast 提示 -->
  <div id="toast" class="toast"></div>

  <script src="script.js"></script>
</body>
</html>
